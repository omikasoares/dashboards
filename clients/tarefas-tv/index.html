:root{color-scheme:dark;--bg:#001e23;--bg2:#00272C;--card:#00323A;--card2:#003D47;--bd:rgba(233,255,74,.14);--bw:rgba(255,255,255,.08);--tx:#fff;--mut:#7a9fa8;--mut2:#4a7078;--lime:#E9FF4A;--red:#E8593C;--amb:#fbbf24;--grn:#4ade80;--blue:#60a5fa;--pink:#f472b6;--org:#fb923c;--pur:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vh/54)}
body{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Poppins,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:3.4rem 1fr;padding:.7rem;gap:.7rem}
body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(38% 38% at 18% 28%,rgba(233,255,74,.075),transparent 70%),radial-gradient(34% 34% at 82% 72%,rgba(96,165,250,.10),transparent 70%),radial-gradient(30% 30% at 60% 15%,rgba(244,114,182,.05),transparent 70%);animation:drift 38s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:3rem 3rem;mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
header,main{position:relative;z-index:1}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4%,-3%) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(1.2rem) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-.35rem) rotate(6deg)}}
@keyframes glow{from{box-shadow:0 0 .8rem rgba(255,211,77,.35)}to{box-shadow:0 0 2rem rgba(255,211,77,.8)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes refresh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
header{display:flex;justify-content:space-between;align-items:center;padding:0 .5rem;position:relative}
.brand{display:flex;align-items:center;gap:1.1rem}.brand img{height:2.3rem;width:auto;flex:none;align-self:center;object-fit:contain}
.brand i{width:1px;height:1.8rem;background:var(--bw)}.brand span{font-size:1.35rem;font-weight:600;letter-spacing:.01em}
.right{display:flex;align-items:center;gap:1.6rem}
.live{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.12em}.live.off{color:var(--amb)}.live.off b{background:var(--amb);box-shadow:0 0 .8rem var(--amb);animation:none}.live b{width:.6rem;height:.6rem;border-radius:50%;background:var(--grn);box-shadow:0 0 .8rem var(--grn);animation:beat 1.6s ease-in-out infinite}
.clk{text-align:right}.clk b{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}.clk b .cl{animation:blink 1s steps(2) infinite;color:var(--lime)}.clk small{display:block;color:var(--mut);font-size:.72rem;margin-top:.1rem}
.rf{position:absolute;left:0;right:0;bottom:-.35rem;height:.14rem;background:var(--bw);border-radius:1px;overflow:hidden}.rf i{display:block;height:100%;background:linear-gradient(90deg,transparent,var(--lime));transform-origin:left;animation:refresh 300s linear infinite}
main{display:grid;grid-template-columns:1fr 31rem;grid-template-rows:20.6rem 1fr;gap:.7rem;min-height:0}
.card{position:relative;background:linear-gradient(160deg,rgba(0,50,58,.92),rgba(0,39,44,.92));border:1px solid var(--bd);border-radius:.9rem;padding:.8rem 1rem;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.14s)}
.card::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:0;background:linear-gradient(100deg,transparent,rgba(233,255,74,.05),transparent);transform:translateX(-120%);animation:sheen 9s ease-in-out infinite;animation-delay:calc(var(--i,0)*2.2s + 3s);pointer-events:none}
.card h2{font-size:.82rem;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.card h2 em{font-style:normal;color:var(--lime)}
.top{grid-column:1/3;display:grid;grid-template-columns:26rem 1fr;gap:.7rem;min-height:0}
.pod{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:.6rem;min-height:0}
.col{position:relative;display:flex;flex-direction:column;align-items:center;width:7.6rem}
.col img{width:4.4rem;height:4.4rem;border-radius:50%;object-fit:cover;border:.2rem solid var(--bw);animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--d)*1s + .9s)}
.col.p1 img{width:5rem;height:5rem;border-color:#FFD34D;animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both,glow 2.2s ease-in-out infinite alternate;animation-delay:1.5s,2.3s}
.col .cr{font-size:1.5rem;line-height:1;height:1.5rem;animation:fade .5s both;animation-delay:calc(var(--d)*1s + 1.3s)}.col.p1 .cr{animation:fade .5s 1.9s both,bob 2.6s ease-in-out 2.4s infinite;transform-origin:center bottom}
.col .nm{font-weight:700;font-size:1.02rem;margin:.2rem 0 .3rem;animation:fade .5s both;animation-delay:calc(var(--d)*1s + 1.1s)}
.ped{width:100%;border-radius:.6rem .6rem 0 0;display:flex;flex-direction:column;align-items:center;padding-top:.45rem;background:linear-gradient(180deg,#0A5262,#00323A);border:1px solid var(--bw);border-bottom:0;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--d)*1s + .2s)}
.col.p1 .ped{height:7.8rem;background:linear-gradient(180deg,#9A7F1C,#3F3512);border-color:rgba(255,211,77,.4)}.col.p2 .ped{height:6.4rem}.col.p3 .ped{height:5rem}
.ped b{font-size:2.3rem;font-weight:800;line-height:1}.col.p1 .ped b{color:#FFD34D}.ped span{font-size:.62rem;color:var(--mut);line-height:1.35}.col.p1 .ped span{color:#d6c27a}
.sp{position:absolute;color:#FFD34D;font-style:normal;font-size:.9rem;opacity:0;animation:twinkle 2.6s ease-in-out infinite;left:var(--x);top:var(--y);animation-delay:var(--dl)}
.chw{flex:1;min-height:0;position:relative}.chw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ln{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.4,0,.2,1) forwards}
.ar{opacity:0;animation:fade 1.2s 1.1s forwards}.pt{opacity:0;animation:pop .5s both}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.lg{display:flex;gap:1.6rem;justify-content:center;margin-top:.3rem;font-size:.85rem;font-weight:500}.lg span{display:flex;align-items:center;gap:.45rem}.lg img{width:1.5rem;height:1.5rem;border-radius:50%;object-fit:cover}.lg b{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}th{font-size:.64rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:.15rem .4rem;border-bottom:1px solid var(--bw);font-weight:600}
td{padding:0 .4rem;height:2.12rem;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r)*.06s)}
.nm2{font-weight:600;max-width:15rem}.tg{display:inline-block;font-size:.6rem;font-weight:700;padding:.12rem .5rem;border-radius:99px;margin-right:.25rem;letter-spacing:.06em}
.t-M{background:rgba(167,139,250,.18);color:#c4b5fd}.t-C{background:rgba(96,165,250,.18);color:#93c5fd}.t-V{background:rgba(74,222,128,.16);color:#86efac}.t-X{background:rgba(251,191,36,.16);color:#fcd34d}
.late{color:var(--red);font-weight:700;animation:blink 1.6s ease-in-out infinite;text-shadow:0 0 .8rem rgba(232,89,60,.5)}.soon{color:var(--amb);font-weight:600}.ok{color:var(--grn)}.none{color:var(--mut2)}
.pb{display:inline-block;width:4.6rem;height:.42rem;background:rgba(255,255,255,.09);border-radius:.3rem;vertical-align:middle;margin-right:.45rem;overflow:hidden}.pb i{display:block;height:100%;border-radius:.3rem;background:linear-gradient(90deg,var(--lime),#D2E132);transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r)*.06s + .25s)}
.dots{display:flex;gap:.35rem}.dots i{width:.5rem;height:.5rem;border-radius:50%;background:var(--bw);transition:.4s}.dots i.on{background:var(--lime);width:1.4rem;border-radius:.3rem}
.pp{display:flex;flex-direction:column;gap:.55rem;flex:1;min-height:0}
.pc{flex:1;display:flex;align-items:center;gap:.8rem;background:rgba(0,30,35,.55);border:1px solid var(--bw);border-radius:.7rem;padding:.4rem .7rem;min-height:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.15s + .5s)}
.pc img{width:3.9rem;height:3.9rem;border-radius:50%;object-fit:cover;border:.17rem solid var(--c)}.pc h3{font-size:1.05rem;font-weight:600}
.pc .st{display:flex;gap:.9rem;margin-left:auto}.pc .st div{text-align:center}.pc .st b{display:block;font-size:1.6rem;font-weight:700;line-height:1.1}.pc .st span{font-size:.58rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.pc .st .r b{color:var(--red)}.pc .st .r.hot b{animation:blink 1.4s ease-in-out infinite;text-shadow:0 0 .8rem rgba(232,89,60,.6)}.pc .st .a b{color:var(--amb)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}.ln{stroke-dashoffset:0}}

function countUp(root){(root||document).querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now(),dl=+(el.dataset.dl||0),du=1300;el.textContent='0';setTimeout(()=>{el.textContent=n},dl+du+250);(function f(t){const p=Math.min(1,Math.max(0,(t-t0-dl)/du));el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}

  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
  $('lg').innerHTML=PEOPLE.map((P,i)=>'<span><i style="width:.9rem;height:.28rem;border-radius:.2rem;background:'+P.cor+';display:inline-block;box-shadow:0 0 .6rem '+P.cor+'"></i>'+P.nome+' · <b style="color:'+P.cor+'">'+vals[i].reduce((t,v)=>t+(v||0),0)+'</b> na semana</span>').join('')}
function tags(n){const m=(n.match(/\[([^\]]+)\]/)||[])[1]||'',o=[];if(/RDSM/.test(m))o.push('<span class="tg t-M">MARKETING</span>');if(/RDCRM/.test(m))o.push('<span class="tg t-C">CRM</span>');if(/RDC(?!RM)/.test(m))o.push('<span class="tg t-V">CONVERSAS</span>');if(/^Curso /.test(n))o.push('<span class="tg t-X">CURSO</span>');return o.join('')}
function prazoDe(l){if(l.prazo)return dia0(l.prazo);const m=l.nome.match(/(\d{2})\/(\d{2})/);if(m&&/^Curso /.test(l.nome))return new Date(2026,+m[2]-1,+m[1]).getTime();return null}
let page=0,rows=[];
function build(){const h=hoje();rows=LISTS.map(l=>{const ts=T.filter(t=>t.l===l.id),ab=ts.filter(isOpen).length,tot=ts.length,pz=prazoDe(l),ini=ts.length?Math.min(...ts.map(t=>t.c)):null;return{l,ab,tot,pz,ini,pct:tot?Math.round((tot-ab)/tot*100):0}}).filter(r=>r.ab>0)
  .sort((a,b)=>{const da=a.pz?Math.floor((h-a.pz)/D):-1e6,db=b.pz?Math.floor((h-b.pz)/D):-1e6;if(!a.pz&&b.pz)return 1;if(a.pz&&!b.pz)return -1;return db-da})}
function proj(){const h=hoje(),PER=10,np=Math.max(1,Math.ceil(rows.length/PER));page=page%np;
  $('pj').innerHTML=rows.slice(page*PER,page*PER+PER).map((r,i)=>{const n=r.l.nome.replace(/\s*\[[^\]]*\]\s*/,' ').replace(/ RT Apuração Assistida/,'').replace(/\s*-\s*$/,'').trim();let s;
    if(!r.pz)s='<span class="none">sem prazo definido</span>';else{const d=Math.floor((h-r.pz)/D);s=d>0?'<span class="late">ATRASADO '+d+(d===1?' dia':' dias')+'</span>':d===0?'<span class="soon">vence hoje</span>':d>=-7?'<span class="soon">faltam '+(-d)+(d===-1?' dia':' dias')+'</span>':'<span class="ok">faltam '+(-d)+' dias</span>'}
    return '<tr class="rw" style="--r:'+i+'"><td class="nm2" title="'+esc(r.l.nome)+'">'+esc(n)+'</td><td>'+(tags(r.l.nome)||'<span class="none">interno</span>')+'</td><td>'+(r.ini?fdy(r.ini):'-')+'</td><td>'+(r.pz?fdy(r.pz):'-')+'</td><td>'+s+'</td><td><span class="pb"><i style="width:'+r.pct+'%;--r:'+i+'"></i></span><b>'+r.ab+'</b> <span class="none">de '+r.tot+'</span></td></tr>'}).join('');
  $('dots').innerHTML=Array.from({length:np},(_,i)=>'<i class="'+(i===page?'on':'')+'"></i>').join('')}
function team(){const h=hoje();$('pp').innerHTML=PEOPLE.map((P,i)=>{const m=T.filter(t=>isOpen(t)&&t.r.includes(P.k)),atr=m.filter(t=>t.p&&t.p<h).length,sete=m.filter(t=>t.p&&t.p>=h&&t.p<h+8*D).length;
  return '<div class="pc" style="--i:'+i+';--c:'+P.cor+'"><img src="'+P.foto+'"><h3>'+P.nome+'</h3><div class="st"><div><b data-n="'+m.length+'" data-dl="'+(700+i*150)+'">'+m.length+'</b><span>abertas</span></div><div class="r'+(atr?' hot':'')+'"><b data-n="'+atr+'" data-dl="'+(700+i*150)+'">'+atr+'</b><span>atrasadas</span></div><div class="a"><b data-n="'+sete+'" data-dl="'+(700+i*150)+'">'+sete+'</b><span>vencem 7d</span></div></div></div>'}).join('');countUp($('pp'))}
const API='https://webhook.autz.com.br/webhook/tarefas-tv-dados-k7q2';let ultimo='';
async function carregar(primeira){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;let d=await r.json();d=Array.isArray(d)?d[0]:d;if(!d||!d.tasks)throw 0;
  $('live').classList.remove('off');$('lv').textContent='ao vivo';if(d.atualizado===ultimo)return;ultimo=d.atualizado;LISTS=d.lists;T=d.tasks;build();podium();team();proj();chart();}
  catch(e){$('live').classList.add('off');$('lv').textContent='reconectando';if(primeira)setTimeout(()=>carregar(true),15000)}}
clock();carregar(true);setInterval(carregar,300000);
setInterval(clock,10000);setInterval(()=>{page++;proj()},15000);setInterval(chart,45000);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(chart,200)});
</script></body></html>
